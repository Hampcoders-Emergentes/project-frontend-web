server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # index.html references hashed bundles, so it must never be cached.
    location = /index.html {
        expires -1;
    }

    # Content-hashed bundles (outputHashing=all) can be cached indefinitely.
    location ~* \.(?:js|css|woff2)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Unhashed static assets (translations, icon sprite, favicon, fonts).
    location /assets/ {
        expires 1d;
        try_files $uri =404;
    }

    # Client-side routes such as /stores/:storeId/alerts fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
